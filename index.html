      const relationCardFromSuggestion = (fromId, toId, relationType, direction = "forward") => {
        const id = `new-relation-${++newRelationSeq}`;
        return `
          <article class="edit-card" data-relation-id="${attr(id)}" data-new="true">
            <div class="form-grid">
              <label class="field"><span>從</span><select data-field="from_entity_id">${
          liveEntityOptions(fromId)
        }</select></label>
              <label class="field"><span>到</span><select data-field="to_entity_id">${
          liveEntityOptions(toId)
        }</select></label>
              <label class="field"><span>關係</span><input data-field="relation_type" list="relation-suggestions" value="${
          attr(relationType)
        }"></label>
              <label class="field"><span>動作</span><select data-field="action">${
          optionList(DRAFT.actions, "create")
        }</select></label>
              <label class="field"><span>方向</span><select data-field="direction">${
          optionList(DRAFT.directions, direction)
        }</select></label>
            </div>
            <label class="field"><span>補充 JSON</span><textarea data-field="metadata" rows="3">{"source":"relation_map_suggestion"}</textarea></label>
          </article>`;
      };

      const relationExists = (fromId, toId, relationType) =>
        [...document.querySelectorAll("[data-relation-id]")].some((card) =>
          card.querySelector('[data-field="from_entity_id"]')?.value === fromId &&
          card.querySelector('[data-field="to_entity_id"]')?.value === toId &&
          card.querySelector('[data-field="relation_type"]')?.value === relationType
        );

      const suggestRelations = () => {
        const cards = [...document.querySelectorAll("[data-entity-id]")];
        const byType = (type) => cards.filter((card) => entityTypeFromCard(card) === type);
        const suggestions = [];
        const add = (from, to, relationType) => {
          if (!from || !to || from === to) return;
          if (relationExists(from.dataset.entityId, to.dataset.entityId, relationType)) return;
          suggestions.push({
            fromId: from.dataset.entityId,
            toId: to.dataset.entityId,
            fromName: entityNameFromCard(from),
            toName: entityNameFromCard(to),
            relationType,
          });
        };
        for (const person of byType("person")) {
          for (const org of byType("organization")) add(person, org, "所屬單位");
          for (const project of byType("project")) add(person, project, "相關專案");
        }
        for (const resource of byType("resource")) {
          for (const org of byType("organization")) add(resource, org, "提供單位");
          for (const project of byType("project")) add(resource, project, "相關專案");
        }
        for (const task of byType("task")) {
          for (const project of byType("project")) add(task, project, "相關專案");
          for (const indicator of byType("indicator")) add(task, indicator, "推動指標");
        }
        for (const schedule of byType("schedule")) {
          for (const task of byType("task")) add(schedule, task, "相關任務");
          for (const project of byType("project")) add(schedule, project, "相關專案");
        }
        for (const record of byType("record")) {
          for (const person of byType("person")) add(record, person, "相關人員");
          for (const org of byType("organization")) add(record, org, "相關單位");
          for (const task of byType("task")) add(record, task, "相關任務");
        }
        return suggestions.slice(0, 8);
      };

      const renderRelationMap = () => {
        const box = document.getElementById("relation-map");
        if (!box) return;
        const cardsById = new Map(
          [...document.querySelectorAll("[data-entity-id]")].map((card) => [
            card.dataset.entityId,
            card,
          ]),
        );
        const existing = [...document.querySelectorAll("[data-relation-id]")].map((card) => {
          const fromId = card.querySelector('[data-field="from_entity_id"]')?.value || "";
          const toId = card.querySelector('[data-field="to_entity_id"]')?.value || "";
          const from = cardsById.get(fromId);
          const to = cardsById.get(toId);
          const relationType = card.querySelector('[data-field="relation_type"]')?.value ||
            "相關";
          if (!from || !to) return "";
          return `<div class="relation-edge"><strong>${
            esc(entityNameFromCard(from))
          }</strong><span class="relation-chip">${
            esc(relationType)
          }</span><strong>${esc(entityNameFromCard(to))}</strong><small>已建立</small></div>`;
        }).filter(Boolean);

        const suggestions = suggestRelations().map((item) =>
          `<div class="relation-suggestion"><strong>${
            esc(item.fromName)
          }</strong><span class="relation-chip">${
            esc(item.relationType)
          }</span><strong>${
            esc(item.toName)
          }</strong><button type="button" data-add-suggested-relation data-from="${
            attr(item.fromId)
          }" data-to="${attr(item.toId)}" data-relation="${
            attr(item.relationType)
          }">加入</button></div>`
        );

        box.innerHTML = [...existing, ...suggestions].join("");
      };

      const mergeStructuredFields = (card, fields) => {
        const merged = { ...(fields || {}) };
        card.querySelectorAll("[data-structured-field]").forEach((input) => {
          const row = input.closest("[data-structured-types]");
          if (row?.classList.contains("structured-hidden")) return;
          const key = input.dataset.structuredField;
          if (!key) return;
          if (input.type === "checkbox") {
            if (key === "syncGoogleCalendar") {
              merged.syncGoogleCalendar = Boolean(input.checked);
              delete merged.sync_gcal;
            } else {
              merged[key] = Boolean(input.checked);
            }
            return;
          }
          const value = (input.value || "").trim();
          if (value) {
            merged[key] = value;
            if (key === "start") merged.date = value;
          } else {
            delete merged[key];
            if (key === "start") delete merged.date;
          }
        });
        return merged;
      };

      const updateStructuredVisibility = (card) => {
        const active = card.querySelector('[data-field="entity_type"]')?.value || "unknown";
        card.querySelector("[data-structured-root]")?.setAttribute(
          "data-active-entity-type",
          active,
        );
        const caption = card.querySelector("[data-structured-caption]");
        if (caption) caption.textContent = DRAFT.structuredCaptions[active] || "自動寫回 JSON";
        card.querySelectorAll("[data-structured-types]").forEach((row) => {
          const types = (row.dataset.structuredTypes || "").split(",").map((item) => item.trim());
          row.classList.toggle(
            "structured-hidden",
            !types.includes("all") && !types.includes(active),
          );
        });
      };

      const updateAllStructuredVisibility = () => {
        document.querySelectorAll("[data-entity-id]").forEach(updateStructuredVisibility);
      };

      const setStructuredValue = (card, key, value) => {
        const input = card.querySelector(`[data-structured-field="${key}"]`);
        if (!input || value === undefined || value === null) return;
        if (input.type === "checkbox") input.checked = Boolean(value);
        else input.value = String(value || "");
      };

      const collectDraftPayload = (status, config) => {
        const entities = [...document.querySelectorAll("[data-entity-id]")].map((card) => ({
          id: card.dataset.entityId,
          client_id: card.dataset.entityId,
          entity_type: card.querySelector('[data-field="entity_type"]').value,
          action: card.querySelector('[data-field="action"]').value,
          display_name: card.querySelector('[data-field="display_name"]').value,
          canonical_name: card.querySelector('[data-field="canonical_name"]').value,
          existing_notion_page_id:
            card.querySelector('[data-field="existing_notion_page_id"]')?.value || "",
          existing_notion_url:
            card.querySelector('[data-field="existing_notion_url"]')?.value || "",
          fields: mergeStructuredFields(
            card,
            parseJsonField(card.querySelector('[data-field="fields"]')),
          ),
          status: status === "confirmed" ? "confirmed" : "edited",
        }));

        const relations = [...document.querySelectorAll("[data-relation-id]")].map((card) => ({
          id: card.dataset.relationId,
          from_entity_id: card.querySelector('[data-field="from_entity_id"]').value,
          to_entity_id: card.querySelector('[data-field="to_entity_id"]').value,
          relation_type: card.querySelector('[data-field="relation_type"]').value,
          action: card.querySelector('[data-field="action"]').value,
          direction: card.querySelector('[data-field="direction"]').value,
          metadata: parseJsonField(card.querySelector('[data-field="metadata"]')),
          status: status === "confirmed" ? "confirmed" : "edited",
        }));

        return {
          draftId: config.draftId,
          token: config.token,
          summary: document.getElementById("draft-summary").value,
          primaryIntent: document.getElementById("draft-intent").value,
          status,
          entities,
          relations,
        };
      };

      const searchRegistry = async (card, config) => {
        const query = card.querySelector('[data-field="lookup_query"]')?.value ||
          card.querySelector('[data-field="canonical_name"]')?.value ||
          card.querySelector('[data-field="display_name"]')?.value ||
          "";
        if (!query.trim()) {
          toast("請先輸入搜尋關鍵字");
          return;
        }
        const search = new URL(config.searchApi);
        search.searchParams.set("draft", config.draftId);
        search.searchParams.set("token", config.token);
        search.searchParams.set("q", query);
        search.searchParams.set(
          "entityType",
          card.querySelector('[data-field="entity_type"]').value || "",
        );
        const response = await fetch(search.toString());
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || "搜尋失敗");
        renderLookupResults(card, data.results || []);
      };

      const renderLookupResults = (card, results) => {
        const box = card.querySelector("[data-lookup-results]");
        if (!box) return;
        if (!results.length) {
          box.innerHTML = `<p class="empty">沒有找到相近既有資料。</p>`;
          return;
        }
        box.innerHTML = results.map((item) => {
          const meta = [item.kind, item.organization, item.phone, item.address]
            .filter(Boolean)
            .join(" / ");
          const payload = attr(JSON.stringify(item));
          return `
            <button type="button" class="lookup-result" data-lookup-apply="${payload}">
              <span><strong>${esc(item.canonicalName || "")}</strong><span>${
            esc(meta)
          }</span></span>
              <span>${Math.round((item.score || 0) * 100)}%</span>
            </button>`;
        }).join("");
      };

      const applyRegistryResult = (card, item) => {
        if (!card || !item) return;
        card.querySelector('[data-field="action"]').value = "reuse";
        card.querySelector('[data-field="display_name"]').value = item.canonicalName || "";
        card.querySelector('[data-field="canonical_name"]').value = item.canonicalName || "";
        card.querySelector('[data-field="existing_notion_page_id"]').value = item.notionPageId ||
          "";
        card.querySelector('[data-field="existing_notion_url"]').value = item.notionUrl || "";
        const fields = parseJsonField(card.querySelector('[data-field="fields"]'));
        const merged = {
          ...fields,
          aliases: item.aliases || fields.aliases,
          phone: item.phone || fields.phone,
          address: item.address || fields.address,
          organization: item.organization || fields.organization,
          note: item.note || fields.note,
          registryMatch: {
            kind: item.kind || "",
            canonicalName: item.canonicalName || "",
            aliases: item.aliases || [],
            phone: item.phone || "",
            address: item.address || "",
            organization: item.organization || "",
            note: item.note || "",
          },
        };
        card.querySelector('[data-field="fields"]').value = JSON.stringify(merged, null, 2);
        setStructuredValue(card, "phone", merged.phone);
        setStructuredValue(card, "address", merged.address);
        setStructuredValue(card, "note", merged.note);
        const matchBox = card.querySelector("[data-registry-match]");
        if (matchBox) matchBox.outerHTML = renderRegistryMatchHtml(merged.registryMatch);
        refreshRelationEntityOptions();
      };

      const buildDraftConfig = (data) => {
        const apiBase = params.get("api") || "";
        const inferAction = (path) => {
          if (!apiBase) return "";
          try {
            const url = new URL(apiBase);
            url.pathname = url.pathname.replace(/\/liff\/draft\.json$/, `/liff/draft${path}`);
            return url.toString();
          } catch {
            return "";
          }
        };
        return {
          draftId: data.draft.id,
          token: data.draft.liffToken,
          saveApi: params.get("saveApi") || inferAction("/save"),
          searchApi: params.get("searchApi") || inferAction("/registry-search"),
        };
      };

      const renderDraft = (data) => {
        const config = buildDraftConfig(data);
        if (!config.saveApi || !config.searchApi) {
          throw new Error("缺少 saveApi 或 searchApi 參數，無法呼叫 Supabase JSON API。");
        }
        document.title = data.draft.summary || "V3 草稿編輯";
        document.body.classList.add("has-sticky");

        const intentOptionsHtml = optionList(DRAFT.intents, data.draft.primaryIntent || "v3_draft");
        const entitiesHtml = data.entities.length
          ? data.entities.map(renderEntityCard).join("")
          : `<p class="empty">尚無候選實體。</p>`;
        const relationsHtml = data.relations.length
          ? data.relations.map((relation) => renderRelationCard(relation, data.entities)).join("")
          : `<p class="empty">尚無候選關聯，下一步可在此建立人員、單位、資源、任務之間的連線。</p>`;
        const attachmentsHtml = data.attachments.length
          ? data.attachments.map(renderAttachmentRow).join("")
          : `<li class="empty">尚無附件。</li>`;

        app.innerHTML = `
          <header class="topbar">
            <div>
              <p class="eyebrow">LINE Assistant V3</p>
              <h1>草稿編輯工作台</h1>
            </div>
            <span class="status ${
          draftStatusClass(data.draft.status)
        }">${esc(data.draft.status || "")}</span>
          </header>
          <section class="panel">
            <label class="field">
              <span>摘要</span>
              <textarea id="draft-summary" rows="3">${esc(data.draft.summary || "")}</textarea>
            </label>
            <label class="field">
              <span>主要處理類型</span>
              <select id="draft-intent">${intentOptionsHtml}</select>
            </label>
            <p class="hint">這裡儲存的是草稿，不會正式寫入 Notion 或 Google Calendar。</p>
          </section>
          <section class="panel">
            <h2>原始訊息</h2>
            <pre>${esc(data.draft.rawText || "")}</pre>
          </section>
          <section class="panel">
            <div class="section-head">
              <h2>候選實體 <span id="entity-count">${data.entities.length}</span></h2>
              <button type="button" class="mini-button" id="add-entity">新增實體</button>
            </div>
            <div class="entity-list" id="entity-list">${entitiesHtml}</div>
          </section>
          <section class="panel">
            <div class="section-head">
              <h2>候選關聯 <span id="relation-count">${data.relations.length}</span></h2>
              <button type="button" class="mini-button" id="add-relation">新增關聯</button>
            </div>
            <div class="relation-map" id="relation-map"></div>
            <div class="relation-list" id="relation-list">${relationsHtml}</div>
          </section>
          <section class="panel">
            <h2>附件 <span>${data.attachments.length}</span></h2>
            <ul class="attachments">${attachmentsHtml}</ul>
          </section>
          <footer class="sticky-actions">
            <button type="button" class="secondary" data-save="editing">儲存草稿</button>
            <button type="button" class="primary" data-save="confirmed">確認草稿</button>
            <button type="button" class="danger" data-save="cancelled">取消草稿</button>
          </footer>`;

        const datalist = document.getElementById("relation-suggestions");
        if (datalist) {
          datalist.innerHTML = DRAFT.relationTypes.map((name) =>
            `<option value="${attr(name)}"></option>`
          ).join("");
        }

        bindDraftEvents(config);
        renderRelationMap();
        updateAllStructuredVisibility();
      };

      const bindDraftEvents = (config) => {
        document.getElementById("add-entity")?.addEventListener("click", () => {
          const list = document.getElementById("entity-list");
          if (!list) return;
          clearEmpty(list);
          list.insertAdjacentHTML("beforeend", newEntityCard());
          refreshRelationEntityOptions();
          updateAllStructuredVisibility();
          toast("已新增候選實體");
        });

        document.getElementById("add-relation")?.addEventListener("click", () => {
          if (document.querySelectorAll("[data-entity-id]").length < 2) {
            toast("至少需要兩個候選實體才能建立關聯");
            return;
          }
          const list = document.getElementById("relation-list");
          if (!list) return;
          clearEmpty(list);
          list.insertAdjacentHTML("beforeend", newRelationCard());
          refreshRelationEntityOptions();
          toast("已新增候選關聯");
        });

        document.addEventListener("click", async (event) => {
          const lookup = event.target.closest("[data-lookup]");
          if (lookup) {
            const card = lookup.closest("[data-entity-id]");
            lookup.disabled = true;
            try {
              await searchRegistry(card, config);
            } catch (error) {
              toast(error.message || String(error));
            } finally {
              lookup.disabled = false;
            }
            return;
          }

          const result = event.target.closest("[data-lookup-apply]");
          if (result) {
            try {
              const payload = JSON.parse(result.dataset.lookupApply || "{}");
              applyRegistryResult(result.closest("[data-entity-id]"), payload);
              toast("已套用既有資料，動作改為沿用");
            } catch (error) {
              toast(error.message || String(error));
            }
            return;
          }

          const suggested = event.target.closest("[data-add-suggested-relation]");
          if (suggested) {
            const list = document.getElementById("relation-list");
            if (!list) return;
            clearEmpty(list);
            list.insertAdjacentHTML(
              "beforeend",
              relationCardFromSuggestion(
                suggested.dataset.from,
                suggested.dataset.to,
                suggested.dataset.relation,
              ),
            );
            refreshRelationEntityOptions();
            toast("已加入建議關聯");
            return;
          }

          const button = event.target.closest("[data-save]");
          if (!button) return;
          button.disabled = true;
          try {
            const payload = collectDraftPayload(button.dataset.save, config);
            const response = await fetch(config.saveApi, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || data.error || "儲存失敗");
            toast(data.message || "已儲存");
            const statusBadge = document.querySelector(".status");
            if (statusBadge && data.draft?.draft?.status) {
              statusBadge.textContent = data.draft.draft.status;
              statusBadge.className = `status ${draftStatusClass(data.draft.draft.status)}`;
            }
          } catch (error) {
            toast(error.message || String(error));
          } finally {
            button.disabled = false;
          }
        });

        document.addEventListener("input", (event) => {
          if (event.target.matches('[data-entity-id] input, [data-entity-id] select')) {
            if (event.target.matches('[data-field="entity_type"]')) {
              updateStructuredVisibility(event.target.closest("[data-entity-id]"));
            }
            refreshRelationEntityOptions();
          }
          if (event.target.matches('[data-relation-id] input, [data-relation-id] select')) {
            renderRelationMap();
          }
        });
      };

      (async () => {
        try {
          await initLiff();
          const mode = params.get("mode") ||
            (params.has("draft") ? "draft" : params.has("date") ? "briefing" : "record");
          if (mode === "task") {
            const apiBase = params.get("api");
            if (!apiBase) throw new Error("缺少 task API URL。");
            const res = await fetch(apiBase, { headers: { accept: "application/json" } });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || data.error || "讀取失敗");
            const config = { actionApi: params.get("actionApi") };
            renderTasks(data, config);
            bindTaskActions(config);
            return;
          }
          if (mode === "quick-capture") {
            const config = { saveApi: params.get("saveApi") };
            if (!config.saveApi) throw new Error("缺少 saveApi 參數。");
            renderQuickCapture(config);
            return;
          }
          if (mode === "inbox") {
            const apiBase = params.get("api");
            if (!apiBase) throw new Error("缺少 inbox API URL。");
            const res = await fetch(apiBase, { headers: { accept: "application/json" } });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || data.error || "讀取失敗");
            const config = {
              actionApi: params.get("actionApi"),
              draftBase: params.get("draftBase"),
              draftApi: params.get("draftApi"),
            };
            renderInbox(data, config);
            bindInboxActions(config);
            return;
          }
          if (mode === "briefing") {
            const apiBase = params.get("api");
            if (!apiBase) throw new Error("缺少 briefing API URL。");
            const res = await fetch(apiUrlWithParams(apiBase, ["date"]), {
              headers: { accept: "application/json" },
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || data.error || "讀取失敗");
            renderBriefing(data);
            return;
          }

          if (mode === "draft") {
            const apiBase = params.get("api");
            if (!apiBase) throw new Error("缺少 draft API URL。");
            const res = await fetch(apiUrlWithParams(apiBase, ["draft", "token", "liffId"]), {
              headers: { accept: "application/json" },
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || data.error || "讀取失敗");
            renderDraft(data);
            return;
          }

          const apiBase = params.get("api") ||
            `${location.origin}/functions/v1/line-webhook/liff/record.json`;
          const apiUrl = apiUrlWithParams(apiBase, ["log", "record", "liffId"]);
          const res = await fetch(apiUrl, { headers: { accept: "application/json" } });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || data.error || "讀取失敗");
          renderRecord(data);
        } catch (error) {
          app.innerHTML = `<section class="panel"><h1>讀取失敗</h1><p>${
            esc(error.message || error)
          }</p></section>`;
        }
      })();
    </script>
  </body>
</html>

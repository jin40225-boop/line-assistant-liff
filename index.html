<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LINE Assistant 明細</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: light; --line:#06c755; --ink:#172026; --muted:#66737c; --bg:#f5f7f8; --card:#fff; --border:#dbe2e6; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { width: min(760px, 100%); margin: 0 auto; padding: 18px 14px 28px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 6px 2px 12px; }
    .eyebrow { margin: 0 0 3px; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 22px; line-height: 1.25; }
    h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
    h2 span { color: var(--muted); font-weight: 650; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin: 10px 0; }
    .grid { display: grid; gap: 10px; }
    .kv { display: grid; grid-template-columns: 88px 1fr; gap: 7px 12px; }
    .kv span { color: var(--muted); }
    .kv strong { font-weight: 650; overflow-wrap: anywhere; }
    .summary, .next { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--border); }
    .next { color: #23485f; }
    .status, .pill { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .ok { color: #087a34; background: #dcf8e6; }
    .warn { color: #8a5a00; background: #fff3cf; }
    .bad { color: #9d1c1c; background: #ffe0e0; }
    .new { color: #075f2a; background: #def8e8; }
    .reuse { color: #36505f; background: #e8eef2; }
    .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
    .items li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 7px; }
    .items .empty { color: var(--muted); justify-content: center; }
    small { display: block; color: var(--muted); margin-top: 2px; }
    .row-actions, .actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .actions { margin-top: 14px; }
    a, button { appearance: none; border: 1px solid var(--border); border-radius: 7px; background: #fff; color: var(--ink); text-decoration: none; padding: 8px 10px; font: inherit; font-weight: 650; }
    a.primary { background: var(--line); border-color: var(--line); color: white; }
    .row-actions a { padding: 4px 7px; font-size: 12px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; color: #26343d; }
    .muted { color: var(--muted); }
    .notice { border-radius: 8px; padding: 12px; margin: 10px 0; }
    @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main id="app"><section class="panel">讀取中...</section></main>
  <script>
    const app = document.getElementById("app");
    const esc = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
    const fmt = (value) => {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat("zh-TW", {
        timeZone: "Asia/Taipei",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }).format(date);
    };
    const link = (label, url, kind = "") => url
      ? `<a class="${kind}" href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label)}</a>`
      : "";
    const section = (title, items = [], includeGcal = false) => `
      <section class="panel">
        <h2>${esc(title)} <span>${items.length}</span></h2>
        <ul class="items">${
          items.length ? items.map((item) => `
            <li>
              <div>
                <strong>${esc(item.title || "未命名")}</strong>
                ${item.date ? `<small>${esc(fmt(item.date))}</small>` : ""}
              </div>
              <div class="row-actions">
                <span class="pill ${item.created ? "new" : "reuse"}">${item.created ? "新增" : "重用"}</span>
                ${link("Notion", item.url)}
                ${includeGcal ? link("GCal", item.gcalUrl) : ""}
              </div>
            </li>`).join("")
          : `<li class="empty">沒有建立或關聯</li>`
        }</ul>
      </section>`;
    const summary = (data) => {
      const entries = Object.entries(data.summary || {}).filter(([, value]) => typeof value !== "object");
      if (!entries.length) return "<p>尚無摘要資料。</p>";
      return `<div class="kv">${entries.map(([key, value]) => `<span>${esc(key)}</span><strong>${esc(value)}</strong>`).join("")}</div>`;
    };
    const render = (data) => {
      const record = data.record || {};
      const statusClass = data.status === "success" ? "ok" : data.status === "failed" ? "bad" : "warn";
      document.title = record.title || "LINE Assistant 明細";
      app.innerHTML = `
        <header class="topbar">
          <div>
            <p class="eyebrow">LINE Assistant</p>
            <h1>${esc(record.title || "V2 記錄明細")}</h1>
          </div>
          <span class="status ${statusClass}">${esc(data.status || "unknown")}</span>
        </header>
        ${data.error ? `<section class="notice bad">${esc(data.error)}</section>` : ""}
        <section class="panel">
          <div class="kv">
            <span>類型</span><strong>${esc(record.type || data.intent || "-")}</strong>
            <span>建立時間</span><strong>${esc(data.createdAtText || "-")}</strong>
            <span>處理時間</span><strong>${data.processingMs ? `${data.processingMs} ms` : "-"}</strong>
            <span>追蹤</span><strong>${record.needsFollowup ? "需要" : "不需要"}</strong>
          </div>
          ${record.summary ? `<p class="summary">${esc(record.summary)}</p>` : ""}
          ${record.nextStep ? `<p class="next">下一步：${esc(record.nextStep)}</p>` : ""}
          <div class="actions">
            ${link("開啟 Notion 記錄", record.url, "primary")}
            ${data.recordId ? `<button type="button" data-copy="${esc(data.recordId)}">複製記錄 ID</button>` : ""}
          </div>
        </section>
        <section class="grid">
          ${section("對象", data.objects)}
          ${section("資源", data.resources)}
          ${section("指標 / 任務", data.indicators)}
          ${section("期程 / 行事曆", data.schedules, true)}
        </section>
        <section class="panel">
          <h2>原始訊息</h2>
          <pre>${esc(data.rawText || "")}</pre>
        </section>
        <section class="panel muted">
          <h2>處理摘要</h2>
          ${summary(data)}
        </section>`;
    };
    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-copy]");
      if (!button) return;
      await navigator.clipboard.writeText(button.dataset.copy);
      button.textContent = "已複製";
    });
    (async () => {
      try {
        const liffId = new URLSearchParams(location.search).get("liffId");
        if (liffId && window.liff) await liff.init({ liffId });
        const apiUrl = `${location.origin}/functions/v1/line-webhook/liff/record.json${location.search}`;
        const res = await fetch(apiUrl, { headers: { accept: "application/json" } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error || "讀取失敗");
        render(data);
      } catch (error) {
        app.innerHTML = `<section class="panel"><h1>讀取失敗</h1><p>${esc(error.message || error)}</p></section>`;
      }
    })();
  </script>
</body>
</html>

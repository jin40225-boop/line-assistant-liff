<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LINE Assistant</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        color-scheme: light;
        --line: #06c755;
        --line-dark: #04a947;
        --ink: #17242c;
        --muted: #667682;
        --bg: #f4f7f8;
        --card: #fff;
        --border: #dbe3e7;
        --soft: #eef5f2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      main {
        width: min(900px, 100%);
        margin: 0 auto;
        padding: 18px 14px 28px;
      }
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 2px 12px;
      }
      .eyebrow, .topbar p, small {
        margin: 0;
        color: var(--muted);
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        line-height: 1.25;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h2 span {
        color: var(--muted);
        font-weight: 650;
      }
      h3 {
        margin: 3px 0 2px;
        font-size: 16px;
        line-height: 1.25;
      }
      button, input, select, textarea {
        font: inherit;
      }
      nav {
        display: inline-flex;
        gap: 6px;
      }
      a, button, nav a {
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        text-decoration: none;
        padding: 7px 9px;
        font-weight: 700;
      }
      button {
        cursor: pointer;
      }
      button.primary, a.primary {
        background: var(--line);
        border-color: var(--line);
        color: white;
      }
      button:disabled {
        background: #9ddbb5;
        cursor: wait;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 8px 0 12px;
      }
      .metric {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        display: grid;
        gap: 2px;
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .metric strong {
        font-size: 22px;
      }
      .grid {
        display: grid;
        gap: 10px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        margin: 0 0 12px;
      }
      .section-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .section-heading h2 {
        margin: 0;
      }
      form {
        display: grid;
        gap: 10px;
      }
      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        padding: 9px 10px;
        min-height: 40px;
      }
      textarea {
        resize: vertical;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .checkline {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: 7px;
        background: var(--soft);
        color: var(--ink);
      }
      .checkline input {
        width: auto;
        min-height: auto;
      }
      .form-actions, .row-actions, .context-actions, .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .form-actions p {
        margin: 0;
        color: var(--muted);
      }
      .form-actions a, .context-actions a {
        color: var(--line-dark);
        font-weight: 800;
        text-decoration: none;
        border: 0;
        padding: 0;
      }
      .context-grid {
        display: grid;
        gap: 9px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .context-card, .context-empty {
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 11px;
        background: #fff;
      }
      .context-card {
        display: grid;
        gap: 8px;
      }
      .context-card p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .context-card ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 4px;
        color: #30434e;
        font-size: 13px;
      }
      .context-kind {
        display: inline-flex;
        border-radius: 999px;
        background: var(--soft);
        color: #2f5f49;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 800;
      }
      .context-actions {
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
      }
      .context-empty, .empty {
        color: var(--muted);
        text-align: center;
      }
      .items {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 9px;
      }
      .items li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
      }
      .items .empty {
        justify-content: center;
      }
      .pill, .status {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: #36505f;
        background: #e8eef2;
        white-space: nowrap;
      }
      .ok {
        color: #087a34;
        background: #dcf8e6;
      }
      .warn {
        color: #8a5a00;
        background: #fff3cf;
      }
      .bad {
        color: #9d1c1c;
        background: #ffe0e0;
      }
      .new {
        color: #075f2a;
        background: #def8e8;
      }
      .kv {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 7px 12px;
      }
      .kv span {
        color: var(--muted);
      }
      .kv strong {
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .summary, .next {
        margin: 12px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .next {
        color: #23485f;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        color: #26343d;
      }
      .notice {
        border-radius: 8px;
        padding: 12px;
        margin: 10px 0;
      }
      @media (max-width: 560px) {
        .summary-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .topbar, .field-row {
          display: grid;
          grid-template-columns: 1fr;
        }
      }
      @media (min-width: 780px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      /* draft editor */
      body.has-sticky main {
        padding-bottom: 96px;
      }
      .hint, small.hint {
        color: var(--muted);
        font-size: 13px;
      }
      .edit-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        display: grid;
        gap: 10px;
      }
      .entity-list, .relation-list {
        display: grid;
        gap: 10px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .section-head h2 {
        margin: 0;
        flex: 1;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .confidence {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        color: #36505f;
        background: #e8eef2;
      }
      .status.draft, .status.editing, .status.awaiting_confirmation {
        color: #8a5a00;
        background: #fff3cf;
      }
      .status.confirmed, .status.committed {
        color: #087a34;
        background: #dcf8e6;
      }
      .status.cancelled, .status.failed {
        color: #9d1c1c;
        background: #ffe0e0;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }
      .lookup-box {
        padding: 10px;
        border: 1px dashed var(--border);
        border-radius: 7px;
        background: #fbfcfd;
        display: grid;
        gap: 8px;
      }
      .lookup-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }
      .lookup-results {
        display: grid;
        gap: 7px;
      }
      .lookup-result {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        text-align: left;
        cursor: pointer;
      }
      .lookup-result strong {
        display: block;
      }
      .lookup-result span {
        color: var(--muted);
        font-size: 12px;
      }
      .structured-fields {
        display: grid;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fbfcfd;
      }
      .structured-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .structured-head span {
        color: var(--muted);
        font-size: 12px;
      }
      .structured-hidden {
        display: none;
      }
      .checkbox-field {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 9px;
        min-height: 42px;
      }
      .checkbox-field input {
        width: auto;
        min-height: auto;
      }
      .relation-map {
        display: grid;
        gap: 8px;
      }
      .relation-map:empty {
        display: none;
      }
      .relation-edge, .relation-suggestion {
        display: grid;
        grid-template-columns: 1fr auto 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fbfcfd;
      }
      .relation-edge strong, .relation-suggestion strong {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .relation-chip {
        justify-self: center;
        color: #345;
        background: #e8eef2;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .relation-suggestion {
        border-style: dashed;
        background: #fffef8;
      }
      .relation-suggestion button {
        padding: 6px 10px;
        font-size: 13px;
        white-space: nowrap;
      }
      .registry-match {
        display: grid;
        gap: 3px;
        padding: 10px;
        border: 1px solid #b8dfc4;
        border-radius: 7px;
        background: #f2fbf5;
      }
      .registry-match span {
        color: #126b2f;
        font-size: 12px;
        font-weight: 800;
      }
      .registry-match strong {
        color: var(--ink);
      }
      .registry-match small {
        color: var(--muted);
      }
      .mini-button {
        min-height: 34px;
        padding: 6px 10px;
        font-size: 13px;
        white-space: nowrap;
      }
      button.danger, a.danger {
        background: #fff5f5;
        border-color: #f2b8b5;
        color: #b3261e;
      }
      .sticky-actions {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        padding: 10px max(14px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right));
        background: rgba(244, 247, 248, 0.94);
        border-top: 1px solid var(--border);
        backdrop-filter: blur(12px);
        z-index: 20;
      }
      #toast {
        position: fixed;
        left: 14px;
        right: 14px;
        bottom: 76px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #172026;
        color: white;
        opacity: 0;
        transform: translateY(8px);
        transition: 0.2s ease;
        pointer-events: none;
        z-index: 30;
      }
      #toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .attachments {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 9px;
      }
      .attachments li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 7px;
      }
      @media (min-width: 720px) {
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }
        .sticky-actions {
          left: 50%;
          transform: translateX(-50%);
          width: min(820px, 100%);
          border: 1px solid var(--border);
          border-bottom: 0;
          border-radius: 10px 10px 0 0;
        }
      }
      /* quick capture */
      .kind-grid {
        border: 0;
        padding: 0;
        margin: 0 0 6px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .kind-grid legend {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .kind-option {
        display: grid;
        gap: 2px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      .kind-option:has(input:checked) {
        border-color: var(--line);
        background: var(--soft);
      }
      .kind-option input {
        display: none;
      }
      .kind-label {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
      }
      .kind-hint {
        font-size: 11px;
        color: var(--muted);
      }
      @media (min-width: 560px) {
        .kind-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      /* inbox */
      .inbox-items {
        display: grid;
        gap: 8px;
      }
      .inbox-item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .inbox-body {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 4px;
      }
      .inbox-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .inbox-head strong {
        overflow-wrap: anywhere;
      }
      .inbox-summary {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .inbox-actions {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <main id="app"><section class="panel">讀取中...</section></main>
    <div id="toast" role="status"></div>
    <datalist id="relation-suggestions"></datalist>
    <script>
      const app = document.getElementById("app");
      const params = new URLSearchParams(location.search);
      const esc = (value) =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      const attr = esc;
      const fmt = (value) => {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat("zh-TW", {
          timeZone: "Asia/Taipei",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).format(date);
      };
      const link = (label, url, kind = "") =>
        url
          ? `<a class="${kind}" href="${attr(url)}" target="_blank" rel="noreferrer">${
            esc(label)
          }</a>`
          : "";
      const apiUrlWithParams = (base, keep) => {
        const url = new URL(base);
        for (const key of keep) {
          const value = params.get(key);
          if (value && !url.searchParams.has(key)) url.searchParams.set(key, value);
        }
        return url.toString();
      };

      async function initLiff() {
        const liffId = params.get("liffId");
        if (liffId && window.liff) {
          try {
            await liff.init({ liffId });
          } catch (error) {
            console.warn("LIFF init skipped:", error);
          }
        }
      }

      function metric(label, count) {
        return `<article class="metric"><span>${esc(label)}</span><strong>${
          count ?? 0
        }</strong></article>`;
      }

      function renderBriefing(data) {
        document.title = `${data.label || ""}工作台`;
        app.innerHTML = `
        <header class="topbar">
          <div>
            <p class="eyebrow">LINE Assistant V3</p>
            <h1>${esc(data.label || "今日")}工作台</h1>
            <p>${esc(fmt(data.range?.start))}</p>
          </div>
          <nav>
            <a href="${briefingHref("today")}">今日</a>
            <a href="${briefingHref("tomorrow")}">明日</a>
          </nav>
        </header>
        ${
          (data.errors || []).length
            ? `<section class="notice warn">${(data.errors || []).map(esc).join("<br>")}</section>`
            : ""
        }
        <section class="summary-grid">
          ${metric("行事曆", data.calendar?.length)}
          ${metric("期程", data.schedules?.length)}
          ${metric("任務", data.tasks?.length)}
          ${metric("備忘", data.memos?.length)}
        </section>
        ${quickCreatePanel(data)}
        ${contextSection(data.contextCards || [])}
        <section class="grid">
          ${briefingSection("Google Calendar", data.calendar || [], "沒有行事曆事件")}
          ${briefingSection("V3 期程", data.schedules || [], "沒有 V3 期程")}
          ${briefingSection("V3 任務", data.tasks || [], "沒有未完成任務")}
          ${briefingSection("未整理備忘", data.memos || [], "沒有未整理備忘")}
        </section>`;
        bindBriefingForm(data);
      }

      function briefingHref(date) {
        const next = new URL(location.href);
        next.searchParams.set("mode", "briefing");
        next.searchParams.set("date", date);
        return next.toString();
      }

      function quickCreatePanel(data) {
        return `
        <section class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">新增草稿</p>
              <h2>補一筆${esc(data.label || "")}事項</h2>
            </div>
            <span class="pill">先進草稿</span>
          </div>
          <form id="briefing-draft-form" data-date-key="${
          attr(data.dateKey || params.get("date") || "today")
        }">
            <div class="field-row">
              <label><span>類型</span><select name="entityType"><option value="schedule">期程 / 提醒</option><option value="task">任務 / 待辦</option><option value="memo">備忘 / Inbox</option></select></label>
              <label><span>重要程度</span><select name="priority"><option value="">未指定</option><option value="高">高</option><option value="中">中</option><option value="低">低</option></select></label>
            </div>
            <label><span>標題</span><input name="title" autocomplete="off" placeholder="例如：下午找童小姐確認餐點" required></label>
            <div class="field-row">
              <label><span>開始時間</span><input name="start" type="datetime-local"></label>
              <label><span>結束時間</span><input name="end" type="datetime-local"></label>
            </div>
            <label class="checkline"><input name="syncGoogleCalendar" type="checkbox"><span>若是期程，確認後同步 Google Calendar</span></label>
            <label><span>補充內容 / 關聯線索</span><textarea name="note" rows="3" placeholder="可寫人員、單位、專案、地點，進草稿後再選關聯"></textarea></label>
            <div class="form-actions"><button class="primary" type="submit">建立草稿</button><p id="briefing-draft-result" role="status"></p></div>
          </form>
        </section>`;
      }

      function bindBriefingForm() {
        const form = document.querySelector("#briefing-draft-form");
        const result = document.querySelector("#briefing-draft-result");
        if (!form) return;
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const createApi = params.get("createApi");
          if (!createApi) {
            result.textContent = "缺少 createApi，無法建立草稿。";
            return;
          }
          const submit = form.querySelector("button[type='submit']");
          const formData = new FormData(form);
          const payload = {
            dateKey: form.dataset.dateKey || "",
            entityType: String(formData.get("entityType") || "schedule"),
            title: String(formData.get("title") || "").trim(),
            start: normalizeLocalDateTime(String(formData.get("start") || "")),
            end: normalizeLocalDateTime(String(formData.get("end") || "")),
            priority: String(formData.get("priority") || ""),
            note: String(formData.get("note") || "").trim(),
            syncGoogleCalendar: formData.get("syncGoogleCalendar") === "on",
          };
          if (!payload.title) {
            result.textContent = "請先輸入標題。";
            return;
          }
          submit.disabled = true;
          result.textContent = "建立草稿中...";
          try {
            const res = await fetch(createApi, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.message || "建立失敗");
            result.innerHTML = data.editUrl
              ? `<a href="${attr(data.editUrl)}">開啟草稿編輯</a>`
              : "草稿已建立";
          } catch (error) {
            result.textContent = error.message || String(error);
          } finally {
            submit.disabled = false;
          }
        });
      }

      function normalizeLocalDateTime(value) {
        if (!value) return "";
        return value.length === 16 ? `${value}:00+08:00` : value;
      }

      function contextSection(cards) {
        const rows = cards.length
          ? cards.slice(0, 12).map(contextCard).join("")
          : `<article class="context-empty">尚未從今日事項找到已關聯的人員、單位、資源或專案。</article>`;
        return `
        <section class="panel">
          <div class="section-heading"><div><p class="eyebrow">情境小卡</p><h2>今日相關資料</h2></div><span class="pill">${cards.length}</span></div>
          <div class="context-grid">${rows}</div>
        </section>`;
      }

      function contextCard(card) {
        const rows = [
          card.phone ? `電話 ${card.phone}` : "",
          card.email ? `Email ${card.email}` : "",
          card.address ? `地址 ${card.address}` : "",
          card.note || "",
        ].filter(Boolean);
        return `
        <article class="context-card">
          <div><span class="context-kind">${esc(kindLabel(card.kind))}</span><h3>${
          esc(card.title)
        }</h3><p>${esc([card.type, card.status].filter(Boolean).join(" / "))}</p></div>
          ${rows.length ? `<ul>${rows.map((row) => `<li>${esc(row)}</li>`).join("")}</ul>` : ""}
          <div class="context-actions"><span>關聯 ${card.sourceCount || 1} 筆</span>${
          card.url ? `<a href="${attr(card.url)}" target="_blank" rel="noreferrer">開啟</a>` : ""
        }</div>
        </article>`;
      }

      function kindLabel(kind) {
        return ({
          people: "人員",
          organizations: "單位",
          resources: "資源",
          projects: "專案",
          cases: "個案",
          tasks: "任務",
          records: "紀錄",
          memos: "備忘",
        })[kind] || kind;
      }

      function briefingSection(title, items, emptyText) {
        const rows = items.length
          ? items.map((item) => `
          <li>
            <div><strong>${esc(item.title || "未命名")}</strong><small>${
            esc([fmt(item.date), item.meta].filter(Boolean).join(" / "))
          }</small></div>
            <div class="row-actions"><span class="pill">${
            esc(item.status || item.type || "")
          }</span>${link("開啟", item.url)}</div>
          </li>`).join("")
          : `<li class="empty">${esc(emptyText)}</li>`;
        return `<section class="panel"><h2>${
          esc(title)
        } <span>${items.length}</span></h2><ul class="items">${rows}</ul></section>`;
      }

      function renderRecord(data) {
        const record = data.record || {};
        const statusClass = data.status === "success"
          ? "ok"
          : data.status === "failed"
          ? "bad"
          : "warn";
        document.title = record.title || "LINE Assistant 明細";
        app.innerHTML = `
        <header class="topbar"><div><p class="eyebrow">LINE Assistant</p><h1>${
          esc(record.title || "V2 記錄明細")
        }</h1></div><span class="status ${statusClass}">${
          esc(data.status || "unknown")
        }</span></header>
        ${data.error ? `<section class="notice bad">${esc(data.error)}</section>` : ""}
        <section class="panel">
          <div class="kv">
            <span>類型</span><strong>${esc(record.type || data.intent || "-")}</strong>
            <span>建立時間</span><strong>${esc(data.createdAtText || "-")}</strong>
            <span>處理時間</span><strong>${
          data.processingMs ? `${data.processingMs} ms` : "-"
        }</strong>
            <span>追蹤</span><strong>${record.needsFollowup ? "需要" : "不需要"}</strong>
          </div>
          ${record.summary ? `<p class="summary">${esc(record.summary)}</p>` : ""}
          ${record.nextStep ? `<p class="next">下一步：${esc(record.nextStep)}</p>` : ""}
          <div class="actions">${link("開啟 Notion 記錄", record.url, "primary")}${
          data.recordId
            ? `<button type="button" data-copy="${esc(data.recordId)}">複製記錄 ID</button>`
            : ""
        }</div>
        </section>
        <section class="grid">
          ${recordSection("對象", data.objects)}
          ${recordSection("資源", data.resources)}
          ${recordSection("指標 / 任務", data.indicators)}
          ${recordSection("期程 / 行事曆", data.schedules, true)}
        </section>
        <section class="panel"><h2>原始訊息</h2><pre>${esc(data.rawText || "")}</pre></section>`;
      }

      function recordSection(title, items = [], includeGcal = false) {
        return `<section class="panel"><h2>${
          esc(title)
        } <span>${items.length}</span></h2><ul class="items">${
          items.length
            ? items.map((item) => `
          <li><div><strong>${esc(item.title || "未命名")}</strong>${
              item.date ? `<small>${esc(fmt(item.date))}</small>` : ""
            }</div><div class="row-actions"><span class="pill ${item.created ? "new" : ""}">${
              item.created ? "新增" : "重用"
            }</span>${link("Notion", item.url)}${
              includeGcal ? link("GCal", item.gcalUrl) : ""
            }</div></li>`).join("")
            : `<li class="empty">沒有建立或關聯</li>`
        }</ul></section>`;
      }

      document.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-copy]");
        if (!button) return;
        await navigator.clipboard.writeText(button.dataset.copy);
        button.textContent = "已複製";
      });

      // -------------------------------------------------------------
      // Inbox workboard (mode=inbox)
      // -------------------------------------------------------------
      const renderInbox = (data, config) => {
        document.title = "收件匣";
        document.body.classList.remove("has-sticky");
        const counts = data.counts || {};
        const errors = (data.errors || []).filter(Boolean);
        const rows = data.rows || [];

        app.innerHTML = `
          <header class="topbar">
            <div>
              <p class="eyebrow">LINE Assistant V3</p>
              <h1>收件匣</h1>
              <p>未確認草稿 ${counts.drafts || 0} · 未整理備忘 ${counts.memos || 0}</p>
            </div>
            <nav>
              <a href="${inboxHref()}" class="primary">重新整理</a>
            </nav>
          </header>
          ${
            errors.length
              ? `<section class="notice warn">${errors.map(esc).join("<br>")}</section>`
              : ""
          }
          <section class="panel">
            <div class="section-heading">
              <h2>未處理項目 <span>${rows.length}</span></h2>
            </div>
            ${
              rows.length
                ? `<ul class="items inbox-items">${
                    rows.map((row) => inboxRow(row, config)).join("")
                  }</ul>`
                : `<p class="empty">收件匣是乾淨的 ✓</p>`
            }
          </section>`;
      };

      const inboxRow = (row, config) => {
        const meta = [
          row.intent,
          row.candidateCount != null ? `候選 ${row.candidateCount}` : "",
          row.createdAt ? fmt(row.createdAt) : "",
        ].filter(Boolean).join(" · ");
        const summary = row.summary || row.title;
        const editUrl = row.source === "draft" && row.draftId && row.liffToken && config.draftBase
          ? buildInboxDraftEditUrl(config, row.draftId, row.liffToken)
          : null;
        const sourceTag = row.source === "draft"
          ? `<span class="pill warn">草稿</span>`
          : `<span class="pill">${esc(row.intent || "備忘")}</span>`;

        return `
          <li class="inbox-item">
            <div class="inbox-body">
              <div class="inbox-head">
                ${sourceTag}
                <strong>${esc(row.title)}</strong>
              </div>
              <small>${esc(meta)}</small>
              ${summary !== row.title ? `<p class="inbox-summary">${esc(summary)}</p>` : ""}
            </div>
            <div class="row-actions inbox-actions">
              ${
                row.source === "draft"
                  ? `
                ${
                    editUrl
                      ? `<a href="${attr(editUrl)}" class="mini-button">編輯</a>`
                      : ""
                  }
                <button type="button" class="mini-button" data-inbox-action="commit_draft" data-draft-id="${
                    attr(row.draftId)
                  }">立即建檔</button>
                <button type="button" class="mini-button" data-inbox-action="cancel_draft" data-draft-id="${
                    attr(row.draftId)
                  }">取消草稿</button>`
                  : `
                ${
                    row.url
                      ? `<a href="${attr(row.url)}" target="_blank" rel="noreferrer" class="mini-button">Notion</a>`
                      : ""
                  }
                <button type="button" class="mini-button" data-inbox-action="process_memo" data-memo-id="${
                    attr(row.id)
                  }">標已整理</button>
                <button type="button" class="mini-button" data-inbox-action="archive_memo" data-memo-id="${
                    attr(row.id)
                  }">封存</button>`
              }
            </div>
          </li>`;
      };

      const inboxHref = () => {
        const next = new URL(location.href);
        next.searchParams.set("mode", "inbox");
        next.searchParams.set("_", Date.now());
        return next.toString();
      };

      const buildInboxDraftEditUrl = (config, draftId, liffToken) => {
        if (!config.draftBase) return null;
        try {
          const url = new URL(config.draftBase);
          url.searchParams.set("mode", "draft");
          url.searchParams.set("draft", draftId);
          url.searchParams.set("token", liffToken);
          if (params.get("liffId")) url.searchParams.set("liffId", params.get("liffId"));
          if (config.draftApi) url.searchParams.set("api", config.draftApi);
          // searchApi/saveApi 由 Supabase 端 redirect 補, 這裡保留最少必要參數
          return url.toString();
        } catch {
          return null;
        }
      };

      const bindInboxActions = (config) => {
        document.addEventListener("click", async (event) => {
          const button = event.target.closest("[data-inbox-action]");
          if (!button) return;
          const action = button.dataset.inboxAction;
          if (!action) return;
          if (!config.actionApi) {
            toast("缺少 actionApi");
            return;
          }
          if (action === "cancel_draft") {
            if (!window.confirm("確定要取消這份草稿?")) return;
          }
          const body = { action };
          if (button.dataset.draftId) body.draftId = button.dataset.draftId;
          if (button.dataset.memoId) body.memoPageId = button.dataset.memoId;
          button.disabled = true;
          try {
            const res = await fetch(config.actionApi, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.message || data.error || "動作失敗");
            toast(data.message || "已更新");
            setTimeout(() => location.reload(), 700);
          } catch (error) {
            toast(error.message || String(error));
            button.disabled = false;
          }
        });
      };

      // -------------------------------------------------------------
      // Quick capture (mode=quick-capture)
      // -------------------------------------------------------------
      const QUICK_CAPTURE_KINDS = [
        ["memo", "備忘 / Inbox", "想到什麼先記下來"],
        ["knowledge", "知識 / 學習", "整理參考資料"],
        ["task", "任務 / 待辦", "有要做的事"],
        ["schedule", "期程 / 提醒", "有時間的行程"],
        ["record", "聯繫 / 記錄", "已經發生過的事"],
        ["resource", "資源", "店家、餐食、場地"],
        ["person", "人員", "聯絡人"],
        ["organization", "單位", "公司、機構、店家"],
      ];

      const renderQuickCapture = (config) => {
        document.title = "快速補登";
        document.body.classList.remove("has-sticky");
        const kindOptions = QUICK_CAPTURE_KINDS.map(([key, label, hint]) =>
          `<label class="kind-option" data-kind-option><input type="radio" name="kind" value="${
            attr(key)
          }" ${key === "memo" ? "checked" : ""}><span class="kind-label">${
            esc(label)
          }</span><span class="kind-hint">${esc(hint)}</span></label>`
        ).join("");

        app.innerHTML = `
          <header class="topbar">
            <div>
              <p class="eyebrow">LINE Assistant V3</p>
              <h1>快速補登</h1>
              <p>先進草稿,確認後才寫入 Notion。</p>
            </div>
          </header>
          <section class="panel">
            <form id="quick-capture-form">
              <fieldset class="kind-grid">
                <legend>類型</legend>
                ${kindOptions}
              </fieldset>
              <label><span>標題（必填）</span><input name="title" autocomplete="off" required maxlength="160" placeholder="例如:童麗華電話 / 5/6 試喝會 / 多代理工具研究"></label>
              <label><span>內容</span><textarea name="content" rows="5" placeholder="可以寫描述、地址、電話、備註"></textarea></label>
              <div class="field-row" data-quick-time-row hidden>
                <label><span>開始時間</span><input name="start" type="datetime-local"></label>
                <label><span>結束時間</span><input name="end" type="datetime-local"></label>
              </div>
              <label class="checkline" data-quick-gcal-row hidden>
                <input name="syncGoogleCalendar" type="checkbox">
                <span>確認後同步 Google Calendar</span>
              </label>
              <label data-quick-priority-row hidden>
                <span>重要程度</span>
                <select name="priority">
                  <option value="">未指定</option>
                  <option value="高">高</option>
                  <option value="中">中</option>
                  <option value="低">低</option>
                </select>
              </label>
              <div class="form-actions">
                <button class="primary" type="submit">建立草稿</button>
                <p id="quick-capture-result" role="status"></p>
              </div>
            </form>
          </section>`;

        bindQuickCaptureForm(config);
      };

      const bindQuickCaptureForm = (config) => {
        const form = document.querySelector("#quick-capture-form");
        const result = document.querySelector("#quick-capture-result");
        if (!form) return;

        const updateContextual = () => {
          const kind = form.querySelector('input[name="kind"]:checked')?.value || "memo";
          const showTime = kind === "schedule" || kind === "record" || kind === "task";
          const showGcal = kind === "schedule";
          const showPriority = kind === "task";
          const setHidden = (selector, hidden) => {
            const el = form.querySelector(selector);
            if (!el) return;
            el.hidden = hidden;
          };
          setHidden('[data-quick-time-row]', !showTime);
          setHidden('[data-quick-gcal-row]', !showGcal);
          setHidden('[data-quick-priority-row]', !showPriority);
        };
        updateContextual();
        form.addEventListener("change", (event) => {
          if (event.target.matches('input[name="kind"]')) updateContextual();
        });

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (!config.saveApi) {
            result.textContent = "缺少 saveApi,無法送出";
            return;
          }
          const submit = form.querySelector("button[type='submit']");
          const formData = new FormData(form);
          const payload = {
            kind: String(formData.get("kind") || "memo"),
            title: String(formData.get("title") || "").trim(),
            content: String(formData.get("content") || "").trim(),
            start: normalizeLocalDateTime(String(formData.get("start") || "")),
            end: normalizeLocalDateTime(String(formData.get("end") || "")),
            priority: String(formData.get("priority") || "") || undefined,
            syncGoogleCalendar: formData.get("syncGoogleCalendar") === "on",
          };
          if (!payload.title) {
            result.textContent = "請先輸入標題。";
            return;
          }
          submit.disabled = true;
          result.textContent = "建立草稿中…";
          try {
            const res = await fetch(config.saveApi, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.message || data.error || "建立失敗");
            result.innerHTML = `${
              esc(data.message || "草稿已建立")
            } ${
              data.editUrl
                ? `<a href="${attr(data.editUrl)}">開啟草稿編輯 →</a>`
                : ""
            }`;
            // Auto-jump to draft editor for relation editing
            if (data.editUrl) setTimeout(() => location.href = data.editUrl, 800);
          } catch (error) {
            result.textContent = error.message || String(error);
          } finally {
            submit.disabled = false;
          }
        });
      };

      // -------------------------------------------------------------
      // Task workboard (mode=task)
      // -------------------------------------------------------------
      const TASK_BUCKETS = [
        { key: "overdue", label: "逾期", tone: "bad" },
        { key: "today", label: "今日", tone: "ok" },
        { key: "tomorrow", label: "明日", tone: "warn" },
        { key: "undated", label: "未排期", tone: "muted" },
        { key: "inProgress", label: "進行中", tone: "muted" },
      ];

      const renderTasks = (data, config) => {
        document.title = "待辦工作台";
        document.body.classList.remove("has-sticky");
        const counts = data.counts || {};
        const buckets = data.buckets || {};
        const total = TASK_BUCKETS.reduce((sum, b) => sum + (counts[b.key] || 0), 0);
        const errors = (data.errors || []).filter(Boolean);

        app.innerHTML = `
          <header class="topbar">
            <div>
              <p class="eyebrow">LINE Assistant V3</p>
              <h1>待辦工作台</h1>
              <p>共 ${total} 筆未完成 · ${esc(fmt(data.generatedAt))}</p>
            </div>
            <nav>
              <a href="${tasksHref()}" class="primary">重新整理</a>
            </nav>
          </header>
          ${
            errors.length
              ? `<section class="notice warn">${errors.map(esc).join("<br>")}</section>`
              : ""
          }
          <section class="summary-grid">
            ${TASK_BUCKETS.map((b) => taskMetric(b, counts[b.key] || 0)).join("")}
          </section>
          <section class="grid">
            ${
              TASK_BUCKETS.map((b) => taskBucketSection(b, buckets[b.key] || [], config)).join("")
            }
          </section>`;
      };

      const taskMetric = (bucket, count) =>
        `<article class="metric"><span>${esc(bucket.label)}</span><strong>${count}</strong></article>`;

      const taskBucketSection = (bucket, items, config) => {
        const rows = items.length
          ? items.map((task) => taskRow(task, bucket, config)).join("")
          : `<li class="empty">${esc(emptyHintFor(bucket.key))}</li>`;
        return `<section class="panel"><h2>${esc(bucket.label)} <span>${items.length}</span></h2><ul class="items">${rows}</ul></section>`;
      };

      const taskRow = (task, bucket, _config) => {
        const due = task.due ? fmtDateOnly(task.due) : "";
        const dueClass = bucket.key === "overdue" ? "bad" : bucket.key === "today" ? "ok" : "";
        const meta = [task.type, task.status, due, task.meta].filter(Boolean).join(" · ");
        return `
          <li data-task-id="${attr(task.id)}">
            <div>
              <strong>${esc(task.title || "未命名任務")}</strong>
              <small>${esc(meta)}</small>
            </div>
            <div class="row-actions">
              <button type="button" class="mini-button" data-task-action="complete" data-task-id="${
                attr(task.id)
              }">完成</button>
              <button type="button" class="mini-button" data-task-action="postpone" data-task-id="${
                attr(task.id)
              }" data-postpone-to="tomorrow">明日</button>
              <button type="button" class="mini-button" data-task-action="postpone" data-task-id="${
                attr(task.id)
              }" data-postpone-to="next_week">下週</button>
              <button type="button" class="mini-button" data-task-action="set_due" data-task-id="${
                attr(task.id)
              }">設日期</button>
              ${
                task.url
                  ? `<a href="${attr(task.url)}" target="_blank" rel="noreferrer">Notion</a>`
                  : ""
              }
              ${dueClass ? `<span class="pill ${dueClass}">${esc(due)}</span>` : ""}
            </div>
          </li>`;
      };

      const emptyHintFor = (key) =>
        ({
          overdue: "沒有逾期任務 ✓",
          today: "今日沒有截止任務",
          tomorrow: "明日沒有截止任務",
          undated: "沒有未排期任務",
          inProgress: "沒有其他進行中任務",
        })[key] || "—";

      const tasksHref = () => {
        const next = new URL(location.href);
        next.searchParams.set("mode", "task");
        next.searchParams.set("_", Date.now());
        return next.toString();
      };

      const fmtDateOnly = (value) => {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat("zh-TW", {
          timeZone: "Asia/Taipei",
          month: "2-digit",
          day: "2-digit",
        }).format(date);
      };

      const bindTaskActions = (config) => {
        document.addEventListener("click", async (event) => {
          const button = event.target.closest("[data-task-action]");
          if (!button) return;
          const action = button.dataset.taskAction;
          const taskId = button.dataset.taskId;
          if (!action || !taskId) return;
          if (!config.actionApi) {
            toast("缺少 actionApi，無法執行動作");
            return;
          }
          const body = { action, taskId };
          if (action === "postpone") body.postponeTo = button.dataset.postponeTo;
          if (action === "set_due") {
            const input = window.prompt("輸入截止日 YYYY-MM-DD（留空取消）", "");
            if (!input) return;
            body.due = input.trim();
          }
          button.disabled = true;
          try {
            const res = await fetch(config.actionApi, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.message || data.error || "動作失敗");
            toast(data.message || "已更新");
            // refresh after action
            setTimeout(() => location.reload(), 600);
          } catch (error) {
            toast(error.message || String(error));
            button.disabled = false;
          }
        });
      };

      // -------------------------------------------------------------
      // Draft mode (mode=draft)
      // -------------------------------------------------------------
      const DRAFT = {
        intents: [
          ["v3_draft", "系統判斷"],
          ["memo", "只存備忘"],
          ["record", "聯繫 / 記錄"],
          ["schedule", "期程 / 提醒"],
          ["task", "任務 / 進度"],
          ["knowledge", "知識"],
          ["resource", "資源"],
          ["project", "專案"],
          ["case", "個案"],
        ],
        entityTypes: [
          ["person", "人員"],

      const parseJsonField = (textarea) => {
        if (!textarea) return {};
        const value = (textarea.value || "").trim();
        if (!value) return {};
        try {
          const parsed = JSON.parse(value);
          return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
        } catch {
          return {};
        }
      };

      const safeText = (value, max) => {
        if (typeof value === "string") return value.trim().slice(0, max);
        if (typeof value === "number" || typeof value === "boolean") {
          return String(value).slice(0, max);
        }
        if (Array.isArray(value)) {
          return value.map((item) => String(item).trim()).filter(Boolean).join(", ").slice(0, max);
        }
        return "";
      };

      const booleanField = (value) => {
        if (typeof value === "boolean") return value;
        if (typeof value === "number") return value !== 0;
        if (typeof value === "string") {
          return ["true", "1", "yes", "y", "on", "是", "同步"].includes(value.trim().toLowerCase());
        }
        return false;
      };

      const structuredInput = (key, label, value, type = "text", types = ["all"]) => `

            ${structuredInput("blocker", "問題 / 阻礙", f.blocker, "text", ["indicator"])}

            ${structuredInput("location", "地點", f.location, "text", ["schedule"])}
            ${structuredInput("domains", "領域", f.domains, "text", ["knowledge"])}
            ${structuredInput("tags", "標籤", f.tags, "text", ["knowledge"])}
            ${structuredInput("ocrText", "解析文字", f.ocrText, "text", ["attachment"])}
            <label class="field checkbox-field" data-structured-types="schedule">
              <input type="checkbox" data-structured-field="syncGoogleCalendar"${
          booleanField(f.syncGoogleCalendar || f.sync_gcal) ? " checked" : ""
        }>
              <span>同步 Google Calendar</span>
            </label>
            <label class="field checkbox-field" data-structured-types="record">
              <input type="checkbox" data-structured-field="needsFollowup"${
          booleanField(f.needsFollowup) ? " checked" : ""
        }>
              <span>需要追蹤</span>
            </label>
          </div>
          <label class="field" data-structured-types="all">
            <span>備註</span>
            <textarea data-structured-field="note" rows="2">${
          esc(safeText(f.note, 600))
        }</textarea>
          </label>
        </div>`;
      };

      const renderRegistryMatchHtml = (match) => {
        const m = match || {};
        if (!m.canonicalName) return `<div data-registry-match></div>`;
        const meta = [m.kind, m.organization, m.phone, m.address].filter(Boolean).join(" / ");
        return `
          <div class="registry-match" data-registry-match>
            <span>可能沿用</span>
            <strong>${esc(m.canonicalName)}</strong>
            ${meta ? `<small>${esc(meta)}</small>` : ""}
          </div>`;
      };

      const renderRegistryMatchSummary = (fields) => {
        const f = fields || {};
        const match = f.registryMatch && typeof f.registryMatch === "object" ? f.registryMatch : null;
        return renderRegistryMatchHtml(match);
      };

      const renderRegistryLookup = (query) => `
        <div class="lookup-box">
          <div class="lookup-row">
            <input data-field="lookup_query" value="${
        attr(query || "")
      }" placeholder="搜尋既有人員 / 單位 / 資源">
            <button type="button" class="mini-button" data-lookup>搜尋既有</button>
          </div>
          <div class="lookup-results" data-lookup-results></div>

      const renderEntityCard = (entity) => {
        const fields = entity.fields || {};
        const fieldsText = JSON.stringify(fields, null, 2);
        return `
          <article class="edit-card" data-entity-id="${attr(entity.id)}">
            <div class="card-head">
              <strong>${esc(entity.displayName || "未命名候選")}</strong>
              <span class="confidence">${esc(entity.confidenceText || "")}</span>
            </div>
            ${renderRegistryMatchSummary(fields)}
            ${renderStructuredFields(fields, entity.entityType)}
            <div class="form-grid">
              <label class="field">
                <span>類型</span>
                <select data-field="entity_type">${
          optionList(DRAFT.entityTypes, entity.entityType || "unknown")
        }</select>
              </label>
              <label class="field">
                <span>動作</span>
                <select data-field="action">${
          optionList(DRAFT.actions, entity.action || "needs_review")
        }</select>
              </label>
              <label class="field">
                <span>顯示名稱</span>
                <input data-field="display_name" value="${attr(entity.displayName || "")}">
              </label>

                <span>標準名稱</span>

              </label>

                <span>既有 Notion Page ID</span>

          attr(entity.existingNotionPageId || "")
        }" placeholder="沿用 / 合併時填入">
              </label>
              <label class="field">
                <span>既有 Notion URL</span>
                <input data-field="existing_notion_url" value="${
          attr(entity.existingNotionUrl || "")
        }">
              </label>
            </div>
            <label class="field">
              <span>欄位 JSON</span>
              <textarea data-field="fields" rows="4">${esc(fieldsText)}</textarea>
            </label>
            ${renderRegistryLookup(entity.displayName || entity.canonicalName || "")}
          </article>`;

      const renderRelationCard = (relation, entities) => {
        const metadataText = JSON.stringify(relation.metadata || {}, null, 2);
        return `
          <article class="edit-card" data-relation-id="${attr(relation.id)}">
            <div class="form-grid">
              <label class="field">
                <span>從</span>
                <select data-field="from_entity_id">${
          entityReferenceOptions(entities, relation.fromEntityId || "")
        }</select>
              </label>
              <label class="field">
                <span>到</span>
                <select data-field="to_entity_id">${
          entityReferenceOptions(entities, relation.toEntityId || "")
        }</select>
              </label>
              <label class="field">
                <span>關係</span>
                <input data-field="relation_type" list="relation-suggestions" value="${
          attr(relation.relationType || "")
        }">
              </label>
              <label class="field">
                <span>動作</span>
                <select data-field="action">${
          optionList(DRAFT.actions, relation.action || "needs_review")
        }</select>
              </label>
              <label class="field">
                <span>方向</span>
                <select data-field="direction">${
          optionList(DRAFT.directions, relation.direction || "forward")
        }</select>
              </label>
            </div>
            <label class="field">
              <span>補充 JSON</span>
              <textarea data-field="metadata" rows="3">${esc(metadataText)}</textarea>

      const renderAttachmentRow = (attachment) => `
        <li>
          <div>
            <strong>${esc(attachment.fileName || attachment.kind || "附件")}</strong>
            <small>${esc(attachment.parseStatus || "")} / ${esc(attachment.status || "")}</small>
          </div>
          ${
        attachment.externalUrl
          ? `<a href="${attr(attachment.externalUrl)}" target="_blank" rel="noreferrer">開啟</a>`
          : ""
      }
        </li>`;

      const entityReferenceOptions = (entities, current) =>
        (entities || []).map((entity) => {
          const label = `${
            entity.canonicalName || entity.displayName || "未命名候選"
          } (${entity.entityType || "unknown"})`;
          return `<option value="${attr(entity.id)}"${
            entity.id === current ? " selected" : ""
          }>${esc(label)}</option>`;
        }).join("");

      const entityLabelFromCard = (card) => {
        const name = card.querySelector('[data-field="canonical_name"]')?.value ||
          card.querySelector('[data-field="display_name"]')?.value ||
          "未命名候選";
        const type = card.querySelector('[data-field="entity_type"]')?.value || "unknown";
        return `${name} (${type})`;
      };

      const entityNameFromCard = (card) =>
        card.querySelector('[data-field="canonical_name"]')?.value ||
        card.querySelector('[data-field="display_name"]')?.value ||
        "未命名候選";

      const entityTypeFromCard = (card) =>
        card.querySelector('[data-field="entity_type"]')?.value || "unknown";

      const liveEntityOptions = (current = "") =>
        [...document.querySelectorAll("[data-entity-id]")].map((card) => {
          const id = card.dataset.entityId;
          return `<option value="${attr(id)}"${
            id === current ? " selected" : ""
          }>${esc(entityLabelFromCard(card))}</option>`;
        }).join("");

      const refreshRelationEntityOptions = () => {
        document
          .querySelectorAll(
            '[data-relation-id] select[data-field="from_entity_id"], [data-relation-id] select[data-field="to_entity_id"]',
          )
          .forEach((select) => {
            const current = select.value;
            select.innerHTML = liveEntityOptions(current);
          });
        const entityCount = document.getElementById("entity-count");
        const relationCount = document.getElementById("relation-count");
        if (entityCount) {
          entityCount.textContent = document.querySelectorAll("[data-entity-id]").length;
        }
        if (relationCount) {
          relationCount.textContent = document.querySelectorAll("[data-relation-id]").length;
        }
        renderRelationMap();
      };

      const clearEmpty = (container) => {
        if (!container) return;
        container.querySelectorAll(".empty").forEach((node) => node.remove());
      };

      const newEntityCard = () => {

          <article class="edit-card" data-entity-id="${attr(id)}" data-new="true">
            <div class="card-head">
              <strong>新增候選</strong>
              <span class="confidence">手動新增</span>
            </div>
            <div data-registry-match></div>
            ${renderStructuredFields({}, "person")}
            <div class="form-grid">
              <label class="field"><span>類型</span><select data-field="entity_type">${
          optionList(DRAFT.entityTypes, "person")
        }</select></label>
              <label class="field"><span>動作</span><select data-field="action">${
          optionList(DRAFT.actions, "create")
        }</select></label>
              <label class="field"><span>顯示名稱</span><input data-field="display_name" value="" placeholder="例如：童麗華"></label>
              <label class="field"><span>標準名稱</span><input data-field="canonical_name" value="" placeholder="正式名稱"></label>

            </div>
            <label class="field"><span>欄位 JSON</span><textarea data-field="fields" rows="4">{}</textarea></label>
            ${renderRegistryLookup("")}
          </article>`;
      };

      const newRelationCard = () => {
        const id = `new-relation-${++newRelationSeq}`;
        return `
          <article class="edit-card" data-relation-id="${attr(id)}" data-new="true">
            <div class="form-grid">
              <label class="field"><span>從</span><select data-field="from_entity_id">${
          liveEntityOptions()
        }</select></label>
              <label class="field"><span>到</span><select data-field="to_entity_id">${
          liveEntityOptions()
        }</select></label>
              <label class="field"><span>關係</span><input data-field="relation_type" list="relation-suggestions" value="相關人員"></label>
              <label class="field"><span>動作</span><select data-field="action">${
          optionList(DRAFT.actions, "create")
        }</select></label>
              <label class="field"><span>方向</span><select data-field="direction">${
          optionList(DRAFT.directions, "forward")
        }</select></label>
            </div>
            <label class="field"><span>補充 JSON</span><textarea data-field="metadata" rows="3">{}</textarea></label>
          </article>`;
